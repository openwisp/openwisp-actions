name: Backport fixes to stable branch

on:
  workflow_call:
    inputs:
      commit_sha:
        required: false
        type: string
        default: ""
      pr_number:
        required: false
        type: number
        default: 0
      comment_body:
        required: false
        type: string
        default: ""
    secrets:
      app_id:
        required: true
      private_key:
        required: true

permissions: {}

jobs:
  parse:
    name: Parse backport request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # Resolves the merge commit and backport targets for the source PR.
    outputs:
      branches: ${{ steps.extract.outputs.branches }}
      sha: ${{ steps.extract.outputs.sha }}
    steps:
      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-scripts
          persist-credentials: false

      - name: Extract backport targets
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          REPO: ${{ github.repository }}
        run: bash workflow-scripts/.github/actions/backport/scripts/__main__.sh parse

  backport:
    name: Backport changes
    needs: parse
    if: >
      needs.parse.outputs.branches != '' && needs.parse.outputs.branches != '[]' &&
      needs.parse.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.parse.outputs.branches) }}
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.private_key }}
          permission-contents: write
          permission-pull-requests: write
          # GitHub requires Workflows: write when a push changes .github/workflows/.
          permission-workflows: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] required for git push

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflow-scripts
          persist-credentials: false

      - name: Configure Git
        working-directory: caller
        run: |
          git config user.name 'OpenWISP Companion'
          git config user.email 'support@openwisp.io'

      - name: Cherry-pick and create PR
        working-directory: caller
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          SHA: ${{ needs.parse.outputs.sha }}
          BRANCH: ${{ matrix.branch }}
          REPO: ${{ github.repository }}
        run: bash ../workflow-scripts/.github/actions/backport/scripts/__main__.sh backport
