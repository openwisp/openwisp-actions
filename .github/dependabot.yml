# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# The upstream documentation URL cannot be split without breaking the link.
# yamllint disable rule:line-length
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# yamllint enable rule:line-length

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "[deps] "
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions" # Check for GitHub Actions updates
    directory: "/" # The root directory where the Ansible role is located
    schedule:
      interval: "monthly" # Check for updates weekly
    commit-message:
      prefix: "[ci] "
    cooldown:
      default-days: 7
