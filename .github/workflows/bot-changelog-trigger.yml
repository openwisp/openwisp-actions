name: Changelog Bot Trigger

on:
  pull_request_review:
    types: [submitted]

# Artifact uploads do not require GITHUB_TOKEN permissions.
permissions: {}

concurrency:
  group: changelog-trigger-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Check approved pull request
    if: >
      github.repository == 'openwisp/openwisp-actions' &&
      github.event.review.state == 'approved' &&
      (github.event.review.author_association == 'OWNER' ||
        github.event.review.author_association == 'MEMBER' ||
        github.event.review.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: read # Reads scripts from the repository's trusted default branch.
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check for noteworthy PR
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash .github/actions/bot-changelog-generator/caller/check-title.sh

      - name: Save PR metadata
        if: steps.check.outputs.has_noteworthy == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr_number

      - name: Upload PR metadata
        if: steps.check.outputs.has_noteworthy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: changelog-metadata
          path: pr_number
          retention-days: 1
