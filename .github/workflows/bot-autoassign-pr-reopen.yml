name: PR Reopen Reassignment
on:
  # Stale fork PR updates run trusted bot code only.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [reopened]
  # The bot verifies the author of recovery comments before writing.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
permissions: {}
concurrency:
  group: >-
    ${{ format('bot-autoassign-pr-reopen-{0}-{1}', github.repository,
    github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: true
jobs:
  reassign-on-reopen:
    if: >
      github.repository == 'openwisp/openwisp-actions' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'reopened'
    permissions:
      contents: read
    uses: $/.github/workflows/reusable-bot-autoassign.yml
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
  handle-pr-activity:
    if: >
      github.repository == 'openwisp/openwisp-actions' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.user.login == github.event.comment.user.login
    permissions:
      contents: read
    uses: $/.github/workflows/reusable-bot-autoassign.yml
    with:
      bot_command: pr_reopen
    secrets:
      OPENWISP_BOT_APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      OPENWISP_BOT_PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
