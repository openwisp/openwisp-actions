name: Changelog Bot Runner

on:
  # The privileged follow-up consumes validated metadata from the trusted review workflow.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Changelog Bot Trigger"]
    types:
      - completed

permissions: {}

jobs:
  fetch-metadata:
    name: Fetch PR metadata
    runs-on: ubuntu-latest
    if: >
      github.repository == 'openwisp/openwisp-actions' &&
      github.event.workflow_run.name == 'Changelog Bot Trigger' &&
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: >-
        ${{ format('changelog-runner-fetch-{0}-{1}-{2}', github.repository,
        github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) }}
      cancel-in-progress: true
    permissions:
      actions: read # Downloads the metadata artifact from the triggering workflow run.
      contents: read # Checks out trusted validation scripts at the workflow revision.
      pull-requests: read # Resolves the PR associated with the triggering commit.
    outputs:
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      head_sha: ${{ steps.approval.outputs.head_sha }}
      base_sha: ${{ steps.approval.outputs.base_sha }}
    steps:
      - name: Checkout trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download PR metadata
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: changelog-metadata
          path: ${{ runner.temp }}/changelog-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Read PR metadata
        if: steps.download.outcome == 'success'
        id: metadata
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/changelog-metadata
        run: bash .github/actions/bot-changelog-generator/caller/read_metadata.sh

      - name: Verify triggering pull request
        if: steps.download.outcome == 'success'
        id: association
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/actions/bot-changelog-generator/caller/verify_association.sh

      - name: Verify current eligible approval
        if: steps.download.outcome == 'success'
        id: approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_HEAD_SHA: ${{ steps.association.outputs.head_sha }}
          PR_NUMBER: ${{ steps.metadata.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/actions/bot-changelog-generator/caller/verify_approval.sh

  # Secrets are used only after validating the current approved PR and its trusted workflow run.
  changelog: # zizmor: ignore[secrets-outside-env]
    name: Generate changelog entry
    needs: fetch-metadata
    if: >
      github.repository == 'openwisp/openwisp-actions' &&
      needs.fetch-metadata.outputs.pr_number != '' &&
      needs.fetch-metadata.outputs.head_sha != '' &&
      needs.fetch-metadata.outputs.base_sha != ''
    concurrency:
      group: changelog-runner-${{ github.repository }}-${{ needs.fetch-metadata.outputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare approved pull request diff
        env:
          APPROVED_HEAD_SHA: ${{ needs.fetch-metadata.outputs.head_sha }}
          APPROVED_BASE_SHA: ${{ needs.fetch-metadata.outputs.base_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: bash .github/actions/bot-changelog-generator/caller/prepare_diff.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install changelog generator dependencies
        run: pip install -r requirements.txt

      - name: Generate App Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        with:
          app-id: ${{ secrets.OPENWISP_BOT_APP_ID }}
          private-key: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
          permission-issues: read
          permission-pull-requests: write

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PR_NUMBER: ${{ needs.fetch-metadata.outputs.pr_number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          PATH="$RUNNER_TEMP:$PATH" python \
            .github/actions/bot-changelog-generator/shared/generate_changelog.py
