name: CI Failure Bot

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_repo:
        required: true
        type: string
      base_repo:
        required: true
        type: string
      run_id:
        required: true
        type: string
      pr_author:
        required: true
        type: string
      actor:
        required: true
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
      APP_ID:
        required: true
      PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  analyze:
    name: Analyze CI failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Bot Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-actions: write
          permission-pull-requests: write

      - name: Checkout Reusable Workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: openwisp-actions
          persist-credentials: false

      - name: Fetch PR Diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUM: ${{ inputs.pr_number }}
          REPO: ${{ inputs.base_repo }}
        run: bash openwisp-actions/.github/actions/bot-ci-failure/reusable/fetch_diff.sh

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: openwisp-actions/requirements.txt

      - name: Install Tools
        run: |
          pip install -r openwisp-actions/requirements.txt

      - name: Fetch Failed Steps Logs
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ inputs.base_repo }}
        run: bash openwisp-actions/.github/actions/bot-ci-failure/reusable/fetch_logs.sh

      - name: Run AI Analysis
        timeout-minutes: 5
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_AUTHOR: ${{ inputs.pr_author }}
          ACTOR: ${{ inputs.actor }}
          COMMIT_SHA: ${{ inputs.head_sha }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CI_RETRY_MODE: ${{ vars.CI_RETRY_MODE }}
        run: python openwisp-actions/.github/actions/bot-ci-failure/reusable/analyze_failure.py > solution.md

      - name: Auto-retry transient failures
        id: retry
        if: hashFiles('transient_failure') != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUM: ${{ inputs.pr_number }}
          RUN_ID: ${{ inputs.run_id }}
          REPO: ${{ inputs.base_repo }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: bash openwisp-actions/.github/actions/bot-ci-failure/reusable/retry.sh

      - name: Post Comment
        if: steps.retry.outputs.retried != 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          PR_NUM: ${{ inputs.pr_number }}
          REPO: ${{ inputs.base_repo }}
        run: bash openwisp-actions/.github/actions/bot-ci-failure/reusable/post_comment.sh
