name: Replicate Commits to Version Branch

on:
  workflow_call:
    inputs:
      module_name:
        description: "The name of the module"
        required: true
        type: string
      client_id:
        description: "The GitHub App client ID"
        required: true
        type: string
      install_package:
        description: "Whether to install the package"
        required: false
        type: boolean
        default: false
    secrets:
      private_key:
        required: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare version branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller
          persist-credentials: false

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: openwisp-actions
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install package if required
        if: inputs.install_package
        working-directory: caller
        run: |
          pip install .

      - name: Get version
        id: get_version
        working-directory: caller
        env:
          MODULE_NAME: ${{ inputs.module_name }}
        run: python ../openwisp-actions/.github/actions/version-branch/reusable/version.py

  replicate:
    name: Replicate commits to version branch
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: version-branch-replication-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: caller
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: openwisp-actions
          persist-credentials: false

      - name: Fast-forward version branch
        working-directory: caller
        run: bash ../openwisp-actions/.github/actions/version-branch/reusable/replicate.sh

      - name: Generate GitHub App Token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          # GitHub requires Workflows: write when a push changes .github/workflows/.
          permission-workflows: write

      - name: Push version branch
        working-directory: caller
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh auth setup-git
          git push origin "$VERSION"
